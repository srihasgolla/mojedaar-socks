name: Install Mojedaar UI polish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject polish script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          tag='<script src="mojedaar-polish.js"></script>'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+tag
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install Mojedaar wishlist and layout polish'
          git push
