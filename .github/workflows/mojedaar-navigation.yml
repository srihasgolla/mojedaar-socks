name: Mojedaar navigation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add navigation script to HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script='''<script id="mojedaar-navigation">document.addEventListener("click",function(e){const el=e.target.closest("[data-path]");if(!el)return;const routes={home:"index.html",shop:"Shop.html","new-drops":"Shop.html",ankle:"Shop.html",crew:"Shop.html","no-show":"Shop.html",cart:"Cart.html",checkout:"Checkout.html",product:"Mirchi Masala Crew Sox.html"};const p=el.getAttribute("data-path");if(routes[p]){e.preventDefault();location.href=routes[p]}});document.addEventListener("DOMContentLoaded",function(){const s=document.querySelector("button[aria-label=\\"Search\\"]");if(s)s.addEventListener("click",function(){const q=prompt("What are you looking for?");if(q&&q.trim())location.href="Shop.html?search="+encodeURIComponent(q.trim())});const m=document.querySelector("button[aria-label=\\"Fun Mood\\"]");if(m)m.addEventListener("click",function(){location.href="Shop.html"})});</script>'''
          for p in Path('.').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              if 'id="mojedaar-navigation"' in t: continue
              if '</body>' in t:
                  t=t.replace('</body>',script+'\n</body>',1)
                  p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html'
          git diff --cached --quiet || (git commit -m 'Fix Mojedaar page navigation' && git push)
