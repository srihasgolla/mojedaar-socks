<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mojedaar — Shop</title><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@400;600;700&family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet"><style>*,*:before,*:after{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden}body{background:#fffdf5;color:#0f0d5a;font-family:Rubik,Fredoka,sans-serif}.top{position:sticky;top:0;z-index:20;background:#fffdf5;border-bottom:3px solid #0f0d5a}.nav{max-width:1200px;margin:auto;min-height:78px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font:900 27px 'Archivo Black';text-decoration:none;color:#0f0d5a}.links{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}.links a{color:#0f0d5a;text-decoration:none;font-weight:900;text-transform:uppercase;font-size:13px}.cart{background:#e4006c;color:#fff;padding:10px 15px;border:3px solid #0f0d5a;border-radius:999px;text-decoration:none;font-weight:900;white-space:nowrap}.hero{max-width:1200px;margin:auto;padding:48px 20px 25px}.hero h1{font:900 clamp(42px,7vw,76px)/.95 'Archivo Black';margin:0;text-transform:uppercase}.hero p{font-size:18px;font-weight:700}.filters{max-width:1200px;margin:auto;padding:20px;display:grid;gap:18px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%;min-width:0}.pill{border:3px solid #0f0d5a;background:#fff;padding:10px 16px;border-radius:999px;font-weight:900;white-space:nowrap;cursor:pointer}.pill.active{background:#ffde00}.control{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:190px}.control label{font-weight:900;white-space:nowrap}.control select{width:100%;min-width:0;height:46px;border:3px solid #0f0d5a;border-radius:12px;background:#fff;padding:0 10px;font-weight:800}.vibes{border-top:2px solid #0f0d5a;padding-top:15px}.grid{max-width:1200px;margin:auto;padding:15px 20px 70px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{background:#fff;border:3px solid #0f0d5a;border-radius:22px;overflow:hidden;box-shadow:5px 5px 0 #0f0d5a;min-width:0}.cardimg{aspect-ratio:1;background:#fff7d6}.info{padding:15px}.info h2{font:900 20px/1.05 'Archivo Black';margin:0 0 9px;text-transform:uppercase;overflow-wrap:anywhere}.price{font-size:19px;font-weight:900;margin-bottom:12px}.add{width:100%;border:3px solid #0f0d5a;background:#e4006c;color:#fff;border-radius:999px;padding:12px;font-weight:900;cursor:pointer}.add:disabled{opacity:.7}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.links{display:none}}@media(max-width:600px){.nav{padding:10px 14px}.hero{padding:34px 14px 20px}.filters{padding:14px}.row{gap:8px}.control{flex:1 1 100%;min-width:0}.grid{grid-template-columns:1fr;padding:12px 14px 50px}.hero h1{font-size:44px}}</style></head><body><header class="top"><div class="nav"><a class="logo" href="index.html">MOJEDAAR</a><nav class="links"><a href="Shop.html">Shop</a><a href="Shop.html">New Drops</a><a href="Shop.html">Ankle</a><a href="Shop.html">Crew</a><a href="Shop.html">No-Show</a><a href="index.html#about">About</a></nav><a class="cart" href="Cart.html">🛒 <span data-cart-count>0</span></a></div></header><main><section class="hero"><h1>SHOP THE SOX</h1><p>Pick your chaos. Add your favourites. Your bag will remember them.</p></section><section class="filters"><div class="row"><button class="pill active">ALL PAIRS</button><button class="pill">ANKLE</button><button class="pill">CREW</button><button class="pill">NO-SHOW</button><button class="pill">BUNDLES</button></div><div class="row"><div class="control"><label for="sort">SORT</label><select id="sort"><option>Most Popular</option><option>Price: Low to High</option><option>Price: High to Low</option><option>Newest</option></select></div><div class="control"><label for="max">MAX ₹</label><select id="max"><option value="9999">Any</option><option value="600">₹600</option><option value="500">₹500</option><option value="450">₹450</option></select></div><div class="control"><label for="size">SIZE</label><select id="size"><option>Free Size</option></select></div></div><div class="row vibes"><button class="pill active">ALL VIBES</button><button class="pill">COLOUR OBSESSED</button><button class="pill">WEIRD &amp; WONDERFUL</button><button class="pill">FOODIE FAVOURITES</button></div></section><section id="product-grid" class="grid"></section></main><script>const products=[['Mirchi Masala Crew Sox',449],['Zigzag Zindagi Ankle',399],['Matchbox Mania Loafer',499],['Smiley Checkmate Socks',429]];const grid=document.getElementById('product-grid');function cart(){try{return JSON.parse(localStorage.getItem('mojedaarCart')||'[]')}catch{return[]}}function badge(){document.querySelector('[data-cart-count]').textContent=cart().reduce((s,i)=>s+(+i.qty||0),0)}function draw(){grid.innerHTML=products.map(([name,price])=>`<article class="card"><div class="cardimg"></div><div class="info"><h2>${name}</h2><div class="price">₹${price}</div><button class="add" data-name="${name}" data-price="${price}">ADD</button></div></article>`).join('');grid.querySelectorAll('.add').forEach(b=>b.onclick=()=>{const c=cart(),id=b.dataset.name+'|'+b.dataset.price,x=c.find(i=>i.id===id);if(x)x.qty=(+x.qty||0)+1;else c.push({id,name:b.dataset.name,price:+b.dataset.price,qty:1});localStorage.setItem('mojedaarCart',JSON.stringify(c));badge();b.textContent='✓ ADDED';b.disabled=true;setTimeout(()=>{b.textContent='ADD';b.disabled=false},900)})}draw();badge();</script><script src="mojedaar-polish.js"></script>
</body></html>
