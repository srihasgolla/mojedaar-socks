name: Deploy Mojedaar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Mojedaar pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['Shop.html','Checkout.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if 'site-fixes.js' not in text:
                  text=text.replace('</body>','<script src="site-fixes.js"></script></body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
